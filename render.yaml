services:
  # 1. Modular Monolith (Backend + Frontend)
  - type: web
    name: chainquery-app
    runtime: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        sync: false  # Must be set in dashboard (e.g. Supabase connection string)
      - key: OPENAI_API_KEY
        sync: false  # Placeholder, must be set in dashboard

# This configuration:
# 1. Creates a Docker web service from your repo
# 2. Relies on an external Database (like Supabase) via the DATABASE_URL environment variable
